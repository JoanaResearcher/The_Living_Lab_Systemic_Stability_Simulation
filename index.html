<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Living Lab | Systemic Stability Simulation</title>
  <meta name="description" content="The Living Lab: Systemic Stability Simulation is a bilingual Living Lab experience for housing stability, administrative accuracy, ADA access, and language support. / The Living Lab: Simulación de Estabilidad Sistémica es una experiencia bilingüe para estabilidad de vivienda, precisión administrativa, acceso ADA y apoyo lingüístico.">
  <meta name="description:es" content="The Living Lab: Simulación de Estabilidad Sistémica es una experiencia bilingüe para estabilidad de vivienda, precisión administrativa, acceso ADA y apoyo lingüístico.">
  <meta property="og:title" content="The Living Lab | Systemic Stability Simulation">
  <meta property="og:description" content="Explore a bilingual, mobile-friendly housing simulation focused on administrative accuracy, accessibility, and systemic performance.">
  <meta property="og:image" content="https://placehold.co/1200x630/png?text=The+Living+Lab+%7C+Inclusive+RFTA+Navigator">
  <meta property="og:type" content="website">
  <style>
    :root {
      --odu-navy: #003057;
      --odu-navy-deep: #001d36;
      --odu-silver: #8a8d8f;
      --odu-silver-light: #d9dde0;
      --surface: #f6f8fa;
      --card: #ffffff;
      --ink: #102433;
      --success: #1f6f50;
      --warning: #6d5a16;
      --border: #c9d1d9;
      --shadow: 0 18px 40px rgba(0, 48, 87, 0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Verdana, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.65;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(138, 141, 143, 0.18), transparent 24%),
        linear-gradient(180deg, #eef2f5 0%, #dde4e9 100%);
    }

    button {
      font: inherit;
    }

    button,
    a {
      min-height: 44px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .app-shell {
      width: min(1220px, calc(100% - 24px));
      margin: 12px auto;
      border-radius: 32px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(0, 29, 54, 0.92);
      color: #fff;
      transition: opacity 200ms ease, visibility 200ms ease;
    }

    .loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      animation: spin 900ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hero {
      padding: 32px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(0, 48, 87, 0.98), rgba(0, 29, 54, 0.98)),
        linear-gradient(135deg, rgba(138, 141, 143, 0.15), transparent);
    }

    .hero-top {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .eyebrow {
      display: inline-flex;
      padding: 10px 14px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-copy {
      max-width: 760px;
      margin-top: 18px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 4.7rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin-top: 16px;
      max-width: 720px;
      font-size: 1.08rem;
      color: rgba(255, 255, 255, 0.92);
    }

    .hero-note {
      margin-top: 18px;
      display: inline-block;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-weight: 700;
    }

    .language-card {
      min-width: min(100%, 320px);
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .language-card h2 {
      font-size: 1rem;
      color: #fff;
    }

    .language-card p {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.98rem;
    }

    .language-controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .language-button {
      min-width: 110px;
      min-height: 52px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .language-button.is-active,
    .language-button:hover,
    .language-button:focus-visible {
      background: #fff;
      color: var(--odu-navy);
      outline: 3px solid rgba(255, 255, 255, 0.2);
      outline-offset: 2px;
    }

    main {
      padding: 30px;
    }

    .selection-view {
      display: grid;
      gap: 22px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .character-card {
      padding: 24px;
      border-radius: 24px;
      border: 2px solid var(--border);
      background: #fff;
      box-shadow: 0 12px 28px rgba(0, 48, 87, 0.06);
    }

    .character-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: var(--odu-navy);
      color: #fff;
      font-size: 1.8rem;
    }

    .character-card h3 {
      margin-top: 16px;
      color: var(--odu-navy-deep);
      font-size: 1.5rem;
    }

    .character-card p {
      margin-top: 12px;
      color: var(--odu-navy-deep);
    }

    .character-tag {
      display: inline-flex;
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--odu-navy);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .select-button {
      margin-top: 18px;
      min-height: 64px;
      font-weight: 700;
    }

    .option-stack {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .stat-card {
      padding: 20px;
      border-radius: 22px;
      border: 2px solid var(--border);
      background: var(--card);
    }

    .stat-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--odu-navy);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-card strong {
      display: block;
      margin-top: 10px;
      font-size: 2rem;
      color: var(--odu-navy-deep);
    }

    .stat-card p {
      margin-top: 10px;
      color: #435462;
    }

    .meter-track {
      margin-top: 14px;
      width: 100%;
      height: 20px;
      border-radius: 999px;
      background: #d8dee4;
      overflow: hidden;
      border: 2px solid #bfc8cf;
    }

    .meter-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--odu-navy), var(--success));
    }

    .layout {
      margin-top: 22px;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      gap: 22px;
    }

    .panel {
      padding: 26px;
      border-radius: var(--radius-xl);
      border: 2px solid var(--border);
      background: var(--card);
      box-shadow: 0 12px 28px rgba(0, 48, 87, 0.06);
    }

    .panel-kicker {
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--odu-navy);
    }

    .panel h2 {
      margin-top: 10px;
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      line-height: 1.15;
      color: var(--odu-navy-deep);
    }

    .panel p {
      margin-top: 12px;
    }

    .maria-card {
      margin-top: 22px;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #f8fafc, #edf2f6);
      border: 2px solid #ced7de;
    }

    .maria-card h3 {
      font-size: 1.45rem;
      color: var(--odu-navy);
    }

    .maria-status {
      margin-top: 16px;
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: #fff;
    }

    .maria-status strong {
      color: var(--odu-navy);
      font-size: 1rem;
    }

    .maria-status p {
      margin-top: 0;
      color: var(--odu-navy-deep);
    }

    .bandwidth-block {
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: #fff;
    }

    .bandwidth-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .bandwidth-head strong,
    .bandwidth-head span {
      color: var(--odu-navy);
    }

    .bandwidth-detail {
      margin-top: 10px;
      color: var(--odu-navy-deep);
    }

    .quote {
      margin-top: 16px;
      padding: 18px;
      border-radius: 18px;
      background: #fff;
      border-left: 6px solid var(--odu-navy);
      border-top: 2px solid var(--border);
      border-right: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
    }

    .quote strong {
      display: block;
      color: var(--odu-navy);
      font-size: 1rem;
    }

    .quote p {
      margin-top: 10px;
      font-size: 1.25rem;
      color: var(--odu-navy-deep);
    }

    .scenario-card {
      margin-top: 24px;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 2px solid #d0d7de;
    }

    .scenario-meta {
      display: inline-flex;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--border);
      font-weight: 700;
      color: var(--odu-navy);
    }

    .feedback {
      margin-top: 22px;
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 2px solid #d4dbe1;
      background: #fff;
    }

    .feedback.is-success {
      border-color: #9bc6b3;
      background: #f4fbf7;
    }

    .feedback.is-warning {
      border-color: #d8c98b;
      background: #fff9e7;
    }

    .feedback h3 {
      color: var(--odu-navy);
      font-size: 1.25rem;
    }

    .feedback p {
      color: var(--odu-navy-deep);
    }

    .feedback-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      margin-right: 10px;
      border-radius: 999px;
      border: 2px solid currentColor;
      font-size: 1.1rem;
      font-weight: 700;
      vertical-align: middle;
    }

    .choice-stack {
      display: grid;
      gap: 16px;
      margin-top: 22px;
    }

    .choice-button,
    .nav-button {
      width: 100%;
      min-height: 64px;
      padding: 18px 20px;
      border-radius: 18px;
      border: 2px solid var(--odu-navy);
      background: #fff;
      color: var(--odu-navy-deep);
      cursor: pointer;
      text-align: left;
    }

    .choice-button strong,
    .nav-button strong {
      display: block;
      font-size: 1.08rem;
    }

    .choice-button span,
    .nav-button span {
      display: block;
      margin-top: 8px;
      color: #3c4b56;
    }

    .choice-button:hover,
    .choice-button:focus-visible,
    .nav-button:hover,
    .nav-button:focus-visible {
      outline: 3px solid rgba(0, 48, 87, 0.22);
      outline-offset: 2px;
      background: #edf4fa;
    }

    .choice-button.is-primary,
    .nav-button.is-primary {
      background: var(--odu-navy);
      color: #fff;
    }

    .choice-button.is-primary span,
    .nav-button.is-primary span {
      color: rgba(255, 255, 255, 0.92);
    }

    .choice-button:disabled,
    .nav-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      background: #e8edf1;
      color: #51616c;
      border-color: #a8b4be;
      outline: none;
    }

    .nav-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .nav-row .nav-button {
      flex: 1 1 220px;
    }

    .learning-bridge {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0, 29, 54, 0.62);
    }

    .learning-bridge.is-visible {
      display: grid;
    }

    .bridge-card {
      width: min(760px, 100%);
      padding: 26px;
      border-radius: 24px;
      border: 3px solid var(--odu-navy);
      background: #fff;
      color: var(--odu-navy-deep);
      box-shadow: 0 20px 48px rgba(0, 29, 54, 0.22);
    }

    .bridge-card h2 {
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      color: var(--odu-navy);
    }

    .bridge-card p {
      margin-top: 14px;
      color: var(--odu-navy-deep);
    }

    .bridge-card .nav-row {
      margin-top: 20px;
    }

    .glossary-button {
      margin-top: 16px;
    }

    .doorway-scene {
      margin-top: 22px;
      display: grid;
      gap: 14px;
      justify-items: center;
      padding: 24px;
      border-radius: 24px;
      border: 2px solid var(--border);
      background: linear-gradient(180deg, #f7fafc, #edf3f7);
    }

    .doorway-art {
      position: relative;
      width: min(320px, 100%);
      height: 220px;
      border-radius: 24px;
      background: linear-gradient(180deg, #dce7ef, #f9fbfc);
      overflow: hidden;
      border: 2px solid #bfd0db;
    }

    .door {
      position: absolute;
      right: 38px;
      bottom: 24px;
      width: 96px;
      height: 150px;
      border-radius: 14px 14px 0 0;
      background: #ffffff;
      border: 4px solid var(--odu-navy);
    }

    .door::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 70px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d1a52b;
    }

    .maria-walk {
      position: absolute;
      left: 64px;
      bottom: 26px;
      font-size: 4rem;
    }

    .key-art {
      position: absolute;
      left: 142px;
      top: 44px;
      font-size: 2.6rem;
    }

    .impact-dashboard {
      margin-top: 22px;
      display: grid;
      gap: 16px;
    }

    .impact-card {
      padding: 20px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: #fff;
    }

    .impact-card strong {
      display: block;
      color: var(--odu-navy);
      font-size: 1.05rem;
    }

    .impact-card p {
      margin-top: 10px;
      color: var(--odu-navy-deep);
    }

    .history-list {
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .history-list li {
      padding: 16px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: #f8fafb;
    }

    .results-panel {
      display: none;
      margin-top: 24px;
      padding: 26px;
      border-radius: var(--radius-xl);
      border: 2px solid var(--border);
      background: #fff;
    }

    .results-panel.is-visible {
      display: block;
    }

    .results-panel h2 {
      margin-top: 10px;
      font-size: clamp(1.9rem, 3vw, 2.9rem);
      color: var(--odu-navy-deep);
    }

    .summary-grid {
      margin-top: 22px;
      display: grid;
      gap: 14px;
    }

    .summary-item {
      padding: 18px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: var(--surface);
    }

    footer {
      padding: 0 30px 30px;
      color: #41515d;
      font-size: 1rem;
    }

    @media (max-width: 980px) {
      .character-grid,
      .admin-grid,
      .stats-grid,
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body {
        font-size: 17px;
      }

      .app-shell {
        width: min(100%, calc(100% - 10px));
        margin: 5px auto;
        border-radius: 24px;
      }

      .hero,
      main,
      footer {
        padding-left: 18px;
        padding-right: 18px;
      }

      .panel,
      .results-panel {
        padding: 20px;
      }

      .nav-row .nav-button,
      .select-button,
      .language-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen" aria-live="polite">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Loading the Living Lab... / Cargando el Laboratorio Viviente...</p>
    </div>
  </div>

  <div class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <div class="hero-copy">
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <div class="hero-note" id="heroNote"></div>
          </div>
        </div>

        <section class="language-card" aria-labelledby="languageLabel">
          <h2 id="languageLabel"></h2>
          <p id="languageDetail"></p>
          <div class="language-controls" role="group" aria-labelledby="languageLabel">
            <button class="language-button" id="englishButton" type="button" tabindex="1">English</button>
            <button class="language-button" id="spanishButton" type="button" tabindex="2">Español</button>
          </div>
          <button class="nav-button glossary-button" id="glossaryButton" type="button" tabindex="3"></button>
        </section>
      </div>
    </header>

    <main>
      <section class="selection-view" id="characterView">
        <article class="panel">
          <div class="panel-kicker" id="selectionKicker"></div>
          <h2 id="selectionTitle"></h2>
          <p id="selectionIntro"></p>
        </article>

        <section class="character-grid" id="characterGrid" aria-label="Character selection"></section>
      </section>

      <section class="selection-view" id="adminView" hidden>
        <article class="panel">
          <div class="panel-kicker" id="adminKicker"></div>
          <h2 id="adminTitle"></h2>
          <p id="adminIntro"></p>
        </article>

        <section class="admin-grid">
          <article class="panel">
            <div class="panel-kicker" id="addressingLabel"></div>
            <h2 id="addressingTitle"></h2>
            <div class="option-stack" id="addressingOptions"></div>
          </article>

          <article class="panel">
            <div class="panel-kicker" id="householdLabel"></div>
            <h2 id="householdTitle"></h2>
            <div class="option-stack" id="householdOptions"></div>
          </article>
        </section>

        <div class="nav-row">
          <button class="nav-button" id="adminBackButton" type="button"></button>
          <button class="nav-button is-primary" id="adminContinueButton" type="button"></button>
        </div>
      </section>

      <section class="stats-grid" id="statsGrid" aria-label="Progress dashboard" hidden>
        <article class="stat-card">
          <div class="stat-label" id="meterLabel"></div>
          <strong id="meterValue"></strong>
          <div class="meter-track" aria-hidden="true">
            <div class="meter-fill" id="meterFill"></div>
          </div>
          <p id="meterDescription"></p>
        </article>

        <article class="stat-card">
          <div class="stat-label" id="dayLabel"></div>
          <strong id="dayValue"></strong>
          <p id="dayDescription"></p>
        </article>

        <article class="stat-card">
          <div class="stat-label" id="guideLabel"></div>
          <strong id="guideValue"></strong>
          <p id="guideDescription"></p>
        </article>
      </section>

      <section class="layout" id="simulationView" hidden>
        <article class="panel">
          <div class="panel-kicker" id="storyKicker"></div>
          <h2 id="storyTitle"></h2>
          <p id="storyIntro"></p>

          <section class="maria-card" aria-labelledby="mariaName">
            <h3 id="mariaName"></h3>
            <p id="mariaSummary"></p>

            <div class="maria-status" aria-live="polite">
              <strong id="emotionLabel"></strong>
              <p id="emotionValue"></p>
              <p id="emotionDetail"></p>
            </div>

            <div class="bandwidth-block" aria-live="polite">
              <div class="bandwidth-head">
                <strong id="bandwidthLabel"></strong>
                <span id="bandwidthValue"></span>
              </div>
              <div class="meter-track" aria-hidden="true">
                <div class="meter-fill" id="bandwidthFill"></div>
              </div>
              <p class="bandwidth-detail" id="bandwidthDetail"></p>
            </div>

            <div class="quote">
              <strong id="mariaQuoteLabel"></strong>
              <p id="mariaQuote"></p>
            </div>
          </section>

          <section class="scenario-card" aria-labelledby="scenarioHeading">
            <h3 id="scenarioHeading"></h3>
            <p id="scenarioBody"></p>
            <div class="scenario-meta" id="scenarioMeta"></div>
          </section>

          <section class="feedback" id="feedbackPanel" aria-live="polite">
            <h3 id="feedbackTitle"></h3>
            <p id="feedbackBody"></p>
          </section>
        </article>

        <aside class="panel">
          <div class="panel-kicker" id="choiceKicker"></div>
          <h2 id="choiceTitle"></h2>
          <p id="choiceIntro"></p>

          <div class="choice-stack" id="choiceStack"></div>

          <div class="nav-row">
            <button class="nav-button" id="backButton" type="button"></button>
            <button class="nav-button is-primary" id="nextButton" type="button"></button>
            <button class="nav-button" id="retryButton" type="button"></button>
            <button class="nav-button" id="restartButton" type="button"></button>
          </div>

          <ul class="history-list" id="historyList"></ul>
        </aside>
      </section>

      <section class="results-panel" id="resultsPanel" aria-live="polite">
        <div class="panel-kicker" id="resultsKicker"></div>
        <h2 id="resultsTitle"></h2>
        <p id="resultsBody"></p>

        <section class="doorway-scene" aria-labelledby="doorwayMessage">
          <div class="doorway-art" aria-hidden="true">
            <div class="maria-walk">🚶‍♀️</div>
            <div class="key-art">🔑</div>
            <div class="door"></div>
          </div>
          <p id="doorwayMessage"></p>
        </section>

        <section class="impact-dashboard" id="impactDashboard">
          <article class="impact-card">
            <strong id="efficiencyLabel"></strong>
            <div class="meter-track" aria-hidden="true">
              <div class="meter-fill" id="efficiencyFill"></div>
            </div>
            <p id="efficiencyValue"></p>
          </article>

          <article class="impact-card">
            <strong id="trustLabel"></strong>
            <div class="meter-track" aria-hidden="true">
              <div class="meter-fill" id="trustFill"></div>
            </div>
            <p id="trustValue"></p>
          </article>

          <article class="impact-card">
            <strong id="timeLabel"></strong>
            <div class="meter-track" aria-hidden="true">
              <div class="meter-fill" id="timeFill"></div>
            </div>
            <p id="timeValue"></p>
          </article>

          <article class="impact-card">
            <strong id="teachingSummaryLabel"></strong>
            <p id="teachingSummaryBody"></p>
          </article>
        </section>

        <div class="summary-grid" id="summaryGrid"></div>

        <div class="nav-row">
          <button class="nav-button" id="downloadRoadmapButton" type="button"></button>
          <button class="nav-button" id="researchAbstractButton" type="button"></button>
          <button class="nav-button" id="resultsBackButton" type="button"></button>
          <button class="nav-button is-primary" id="resultsRestartButton" type="button"></button>
        </div>
      </section>
    </main>

    <footer id="footerText"></footer>
  </div>

  <div class="learning-bridge" id="learningBridge" aria-hidden="true">
    <section class="bridge-card" role="dialog" aria-modal="true" aria-labelledby="bridgeTitle">
      <div class="panel-kicker" id="bridgeKicker"></div>
      <h2 id="bridgeTitle"></h2>
      <p id="bridgeBody"></p>
      <div class="nav-row">
        <button class="nav-button is-primary" id="bridgeCloseButton" type="button"></button>
      </div>
    </section>
  </div>

  <div class="learning-bridge" id="glossaryModal" aria-hidden="true">
    <section class="bridge-card" role="dialog" aria-modal="true" aria-labelledby="glossaryTitle">
      <div class="panel-kicker" id="glossaryKicker"></div>
      <h2 id="glossaryTitle"></h2>
      <p id="glossaryIntro"></p>
      <div class="summary-grid" id="glossaryList"></div>
      <div class="nav-row">
        <button class="nav-button is-primary" id="glossaryCloseButton" type="button"></button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
